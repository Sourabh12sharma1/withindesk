# Hostinger uses pnpm with strict dependency builds.
# Approve every package that needs a native/postinstall script.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - fsevents
  - sharp
  - unrs-resolver
  - workerd
allowBuilds:
  better-sqlite3: true
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
strictDepBuilds: false
trustLockfile: true
enableGlobalVirtualStore: false
packageImportMethod: auto
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.4
